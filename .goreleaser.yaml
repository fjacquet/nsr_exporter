version: 2

project_name: nsr_exporter

before:
  hooks:
    - go mod tidy

builds:
  - id: nsr_exporter
    main: .
    binary: nsr_exporter
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    # Windows ships as .zip per platform convention (the binary itself gets .exe).
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - config.yaml

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: module
    artifacts: archive
    cmd: cyclonedx-gomod
    # GoReleaser runs the hook in ./dist, so the module path is one level up.
    args: ["mod", "-licenses", "-json", "-output", "$document", "../"]

dockers_v2:
  - id: nsr_exporter
    ids:
      - nsr_exporter
    dockerfile: Dockerfile.goreleaser
    images:
      - "ghcr.io/fjacquet/nsr_exporter"
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - config.yaml
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/fjacquet/nsr_exporter"
    sbom: true

homebrew_casks:
  - name: nsr_exporter
    repository:
      owner: fjacquet
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    # The cask repository token MUST be a plain {{ .Env.VAR }} field reference — the
    # {{ index .Env "VAR" }} form fails GoReleaser's publish-time validation
    # ("homebrew cask: expected {{ .Env.VAR_NAME }} only"). Self-skip when the cross-repo
    # token is absent is handled by skip_upload below (the default GITHUB_TOKEN cannot push
    # to another repo); when skip_upload is true GoReleaser never resolves the token, so a
    # missing var stays safe.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/fjacquet/nsr_exporter
    description: Prometheus + OTLP exporter for Dell EMC NetWorker
    hooks:
      post:
        install: |
          if OS.mac?
            system "xattr", "-d", "com.apple.quarantine", "#{staged_path}/nsr_exporter" rescue nil
          end

changelog:
  use: github-native

release:
  prerelease: auto
