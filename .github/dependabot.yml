version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
    ignore:
      # Pre-release base images are never appropriate for a production image.
      # Dependabot sorts golang:1.27rc1 above 1.26.x and proposed exactly that,
      # so without this it re-opens the same RC bump every week.
      - dependency-name: "*"
        versions: ["*.*.*-rc.*", "*.*.*-beta.*"]
